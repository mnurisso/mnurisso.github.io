name: Update papers from ORCID

on:
  schedule:
    - cron: '17 5 * * 1'   # every Monday, 05:17 UTC
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for new journal articles
        run: python3 scripts/update-papers.py --body "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nothing new."
            exit 0
          fi
          python3 scripts/check-links.py
          branch=auto/new-papers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add index.html
          git commit -m "Add new journal article(s) from ORCID"
          git push --force origin "$branch"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "New paper(s) from ORCID" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
